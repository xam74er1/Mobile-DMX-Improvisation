name: Build Release APK

# Fires when a version tag is pushed, e.g. `git tag v1.2.0 && git push origin v1.2.0`.
# Builds a standalone release APK (JS bundled in) — not a dev-client build that
# needs a Metro server — and attaches it to a GitHub Release for the tag.
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK with version
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/dmx-improvisator-${VERSION}.apk"
          echo "path=out/dmx-improvisator-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
